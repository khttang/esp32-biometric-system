[package]
name = "biometric-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Hardware-independent logic for the ESP32-P4 biometric firmware (host-testable)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
# Model signatures. Pure Rust, so the same code verifies on the host and on the board.
ed25519-dalek = { version = "2", default-features = false }

# Lints this project has decided against. Everything else stays on; CI denies all warnings.
[lints.clippy]
# A `Default` impl needs a real caller, like any other impl (see CLAUDE.md, Abstraction Rules).
new_without_default = "allow"
