name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host crates (fmt, clippy, tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [biometric-core, model-packer, face-eval]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }}

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

  firmware:
    name: firmware (fmt, clippy, ESP32-P4 release build)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # .cargo/config.toml sets a macOS Python path under [env]; Cargo's [env] does not
      # override variables already present in the environment, so this takes precedence.
      - name: Point ESP-IDF tooling at the runner's Python
        run: echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # ESP-IDF, its Python env and the RISC-V toolchain (~5 GB) are installed by esp-idf-sys
      # into firmware/.embuild on the first build.
      - name: Cache ESP-IDF (.embuild)
        uses: actions/cache@v6
        with:
          path: firmware/.embuild
          key: embuild-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml', 'firmware/rust-toolchain.toml') }}

      # Also caches ~/.cargo/bin, so ldproxy is only built on a cache miss.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
          cache-on-failure: true

      - name: Install ldproxy
        run: command -v ldproxy || cargo install ldproxy --locked

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release -- -D warnings

      # The evaluation harness is a cargo feature and would otherwise never be checked.
      - name: clippy (eval feature)
        run: cargo clippy --release --features eval -- -D warnings

      - name: Release build
        run: cargo build --release
