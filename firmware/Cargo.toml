[package]
name = "firmware"
version = "0.1.0"
authors = ["ktang <khttang@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.90"

[[bin]]
name = "firmware"
path = "src/main.rs"

# --------------------------------------------------------------------------
# Compilation Profiles
# --------------------------------------------------------------------------
[profile.release]
opt-level = "s"         # Optimize for size (use "3" for maximum math speed if needed)
lto = true              # Link-Time Optimization across C/C++ and Rust
codegen-units = 1 
panic = "abort" 

[profile.dev]
debug = true 
opt-level = "z"        # Optimize for size in dev to prevent binary flash overflow

[profile.dev.package.firmware]
opt-level = 3

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
[dependencies]
libc = "0.2"
log = "0.4"
anyhow = "1.0.104"

# --- Essential Espressif & Async Ecosystem ---
esp-idf-sys = { version = "0.37.2", features = ["binstart"] }
esp-idf-svc = { version = "0.52.1", features = ["alloc", "std", "critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
tokio = { version = "1.38", default-features = false, features = ["rt", "sync", "time", "macros"] }
arc-swap = "1.9.2"

# --- Serialization for Biometric Templates & Config ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# -----------------------------------------------------------------------------
# ESP-IDF System & Component Manager Metadata
# -----------------------------------------------------------------------------
[package.metadata.esp-idf-sys]
sdkconfig_defaults = ["sdkconfig.defaults"]
esp_idf_tools_install_dir = "workspace"

# Local C/C++ Subcomponents Directory
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]

# Remote Managed Espressif Components
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-dl", version = "^3.3.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_video", version = "^2.3.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/es8311", version = "^1.0.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_hx8394", version = "^2.0.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_codec_dev", version = "^1.6.2" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_touch", version = "^1.2.0" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_touch_gt911", version = "^1.2.0" }

# LVGL & LVGL Porting Layer
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "lvgl/lvgl", version = "^9.2.2" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lvgl_port", version = "^2.3.2" }

# -----------------------------------------------------------------------------
# Build Dependencies (C Bindgen & IDF CMake Integration)
# -----------------------------------------------------------------------------
[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
bindgen = "0.72.1"

