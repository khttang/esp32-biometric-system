[package]
name = "firmware"
version = "0.1.0"
authors = ["ktang <khttang@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.99"

[[bin]]
name = "firmware"
path = "src/main.rs"

# --------------------------------------------------------------------------
# Compilation Profiles
# --------------------------------------------------------------------------
[profile.release]
opt-level = "s"         # Optimize for size (use "3" for maximum math speed if needed)
lto = true              # Link-Time Optimization across C/C++ and Rust
codegen-units = 1 
panic = "abort" 

[profile.dev]
debug = true 
opt-level = "z"        # Optimize for size in dev to prevent binary flash overflow

[profile.dev.package.firmware]
opt-level = 3

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
# Evaluation harness: the firmware serves images sent by crates/face-eval instead of running
# the camera pipeline (see src/eval.rs). Never enable it on a deployed device.
eval = []

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
[dependencies]
log = "0.4"
anyhow = "1.0.104"

# --- Essential Espressif & Async Ecosystem ---
esp-idf-sys = { version = "0.38.1", features = ["binstart"] }
esp-idf-svc = { version = "0.53.0", features = ["alloc", "std", "critical-section"] }
arc-swap = "1.9.2"
biometric-core = { path = "../crates/biometric-core" }

# --- Serialization for Biometric Templates & Config ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# -----------------------------------------------------------------------------
# ESP-IDF System & Component Manager Metadata
# -----------------------------------------------------------------------------
[package.metadata.esp-idf-sys]
sdkconfig_defaults = ["sdkconfig.defaults"]
esp_idf_tools_install_dir = "workspace"
extra_clang_args = ["-DISP_LL_EVENT_ERROR_MASK=0"]

# Local C/C++ Subcomponents Directory
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]
bindings_header = "components/biometrics_wrapper/include/bindings.h"

# -----------------------------------------------------------------------------
# Build Dependencies (C Bindgen & IDF CMake Integration)
# -----------------------------------------------------------------------------
[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

